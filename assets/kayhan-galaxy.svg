<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
<title id="title">Kayhan 3D spiral galaxy</title>
<defs>
 <linearGradient id="arm" x1="18" y1="20" x2="112" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#b8f5ff"/><stop offset=".32" stop-color="#55d8ff"/><stop offset=".68" stop-color="#8c78ff"/><stop offset="1" stop-color="#f3a7ff"/></linearGradient>
 <linearGradient id="rim" x1="22" y1="42" x2="108" y2="92" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".28" stop-color="#75e6ff"/><stop offset=".72" stop-color="#8c75ff"/><stop offset="1" stop-color="#f4a9ff" stop-opacity=".25"/></linearGradient>
 <radialGradient id="core" cx="42%" cy="35%" r="68%"><stop stop-color="#fff"/><stop offset=".18" stop-color="#e8faff"/><stop offset=".42" stop-color="#80eaff"/><stop offset=".72" stop-color="#8b78ff"/><stop offset="1" stop-color="#3a2d86" stop-opacity="0"/></radialGradient>
 <radialGradient id="haze"><stop stop-color="#8d7aff" stop-opacity=".48"/><stop offset="1" stop-color="#4bdfff" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<ellipse cx="64" cy="66" rx="54" ry="34" fill="url(#haze)" transform="rotate(-27 64 66)" filter="url(#soft)"/>
<!-- far side of the warped galactic disk -->
<path d="M12 67C27 37 73 23 108 43c10 6 12 15 5 22-13-13-34-17-55-11C38 62 23 77 16 88 9 83 8 75 12 67Z" fill="#5269dc" opacity=".34"/>
<path d="M14 67C31 43 68 31 99 43" fill="none" stroke="#b9f4ff" stroke-width="2.2" stroke-linecap="round" opacity=".8" filter="url(#glow)"/>
<!-- broad, sculpted spiral arms -->
<path d="M64 63C82 48 104 47 111 61c7 14-9 27-28 27-18 0-32-9-39-19-8-12-5-27 9-37 14-10 35-10 48-1" fill="none" stroke="url(#arm)" stroke-width="10" stroke-linecap="round" opacity=".92" filter="url(#glow)"/>
<path d="M64 63C49 77 28 82 18 69 8 55 22 39 40 37c17-2 31 6 39 17 9 12 8 28-3 39-11 11-29 15-44 9" fill="none" stroke="url(#arm)" stroke-width="7" stroke-linecap="round" opacity=".92" filter="url(#glow)"/>
<!-- lower curved 3D edge -->
<path d="M15 77C36 98 77 103 105 78" fill="none" stroke="#3aa9ed" stroke-width="5" stroke-linecap="round" opacity=".55"/>
<path d="M19 81C43 96 76 96 99 80" fill="none" stroke="url(#rim)" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
<!-- bright nucleus -->
<ellipse cx="63" cy="64" rx="15" ry="10" transform="rotate(-27 63 64)" fill="url(#core)" filter="url(#glow)"/>
<ellipse cx="63" cy="64" rx="5.2" ry="3.6" transform="rotate(-27 63 64)" fill="#fff" opacity=".96"/>
<!-- star glints -->
<g fill="#fff" filter="url(#glow)"><circle cx="29" cy="48" r="1.7"/><circle cx="94" cy="38" r="1.4"/><circle cx="101" cy="82" r="1.5"/><circle cx="37" cy="91" r="1.1"/></g>
<g stroke="#dffaff" stroke-width="1.3" stroke-linecap="round" opacity=".9"><path d="M19 27v7m-3.5-3.5h7"/><path d="M105 20v6m-3-3h6"/></g>
</svg>